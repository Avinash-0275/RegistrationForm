<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced Registration Form</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#eef2f7;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:#fff;
    padding:25px;
    width:360px;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    margin-bottom:15px;
}

label{
    font-weight:bold;
    display:block;
    margin-top:10px;
}

input[type="text"],
input[type="password"]{
    width:100%;
    padding:8px;
    margin-top:4px;
    border:2px solid #ccc;
    border-radius:4px;
    outline:none;
}

input:focus{
    border-color:#007bff;
}

.error{
    color:red;
    font-size:12px;
}

.success{
    border-color:green !important;
}

.error-border{
    border-color:red !important;
}

.gender-group{
    margin-top:5px;
}

button{
    width:100%;
    margin-top:15px;
    padding:10px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}
</style>
</head>

<body>

<div class="container">
<h2>Registration Form</h2>

<form onsubmit="return validateForm()">

<label>Name</label>
<input type="text" id="name">
<div class="error" id="nameError"></div>

<label>Email</label>
<input type="text" id="email">
<div class="error" id="emailError"></div>

<label>Password</label>
<input type="password" id="password">
<div class="error" id="passwordError"></div>

<label>Confirm Password</label>
<input type="password" id="confirmPassword">
<div class="error" id="confirmPasswordError"></div>

<label>Mobile Number</label>
<input type="text" id="mobile">
<div class="error" id="mobileError"></div>

<label>Gender</label>
<div class="gender-group">
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
</div>
<div class="error" id="genderError"></div>

<br>
<input type="checkbox" id="terms"> I accept Terms & Conditions
<div class="error" id="termsError"></div>

<button type="submit">Register</button>
</form>
</div>

<script>
function validateForm(){

let valid=true;

function setError(id,msg){
    document.getElementById(id).classList.add("error-border");
    document.getElementById(id+"Error").innerHTML=msg;
    valid=false;
}

function setSuccess(id){
    document.getElementById(id).classList.remove("error-border");
    document.getElementById(id).classList.add("success");
}

document.querySelectorAll(".error").forEach(e=>e.innerHTML="");
document.querySelectorAll("input").forEach(i=>{
    i.classList.remove("error-border","success");
});

let name=document.getElementById("name").value.trim();
let email=document.getElementById("email").value.trim();
let password=document.getElementById("password").value;
let confirmPassword=document.getElementById("confirmPassword").value;
let mobile=document.getElementById("mobile").value;
let gender=document.querySelector('input[name="gender"]:checked');
let terms=document.getElementById("terms").checked;

if(name==="") setError("name","Name cannot be empty");
else setSuccess("name");

let emailPattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
if(!emailPattern.test(email)) setError("email","Invalid email format");
else setSuccess("email");

if(password.length<8) setError("password","Minimum 8 characters required");
else setSuccess("password");

if(password!==confirmPassword) setError("confirmPassword","Passwords do not match");
else setSuccess("confirmPassword");

let mobilePattern=/^[0-9]{10}$/;
if(!mobilePattern.test(mobile)) setError("mobile","Enter valid 10-digit number");
else setSuccess("mobile");

if(gender===null){
    document.getElementById("genderError").innerHTML="Select gender";
    valid=false;
}

if(!terms){
    document.getElementById("termsError").innerHTML="Accept Terms & Conditions";
    valid=false;
}

if(valid){
    alert("✅ Registration Successful!");
}

return valid;
}
</script>

</body>
</html>
