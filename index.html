<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
        }

        .error {
            color: red;
            font-size: 14px;
        }

        .success {
            color: green;
            font-size: 16px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<h2>Registration Form</h2>

<form onsubmit="return validateForm()">

Name:<br>
<input type="text" id="name"><br>
<span id="nameError" class="error"></span><br>

Email:<br>
<input type="text" id="email"><br>
<span id="emailError" class="error"></span><br>

Password:<br>
<input type="password" id="password"><br>
<span id="passwordError" class="error"></span><br>

Confirm Password:<br>
<input type="password" id="confirm"><br>
<span id="confirmError" class="error"></span><br>

Mobile Number:<br>
<input type="text" id="mobile"><br>
<span id="mobileError" class="error"></span><br>

Gender:<br>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female<br>
<span id="genderError" class="error"></span><br>

<input type="checkbox" id="terms">
I accept Terms & Conditions<br>
<span id="termsError" class="error"></span><br>

<button type="submit">Register</button>

<p id="successMsg" class="success"></p>

</form>

<script>
function validateForm() {

    document.getElementById("successMsg").innerHTML = "";

    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value;
    let confirm = document.getElementById("confirm").value;
    let mobile = document.getElementById("mobile").value;
    let terms = document.getElementById("terms").checked;
    let gender = document.getElementsByName("gender");

    document.querySelectorAll(".error").forEach(e => e.innerHTML = "");

    let valid = true;

    if (name === "") {
        document.getElementById("nameError").innerHTML = "Name cannot be empty";
        valid = false;
    }

    let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailPattern.test(email)) {
        document.getElementById("emailError").innerHTML = "Enter valid email format";
        valid = false;
    }

    if (password.length < 8) {
        document.getElementById("passwordError").innerHTML = "Minimum 8 characters required";
        valid = false;
    }

    if (password !== confirm) {
        document.getElementById("confirmError").innerHTML = "Passwords do not match";
        valid = false;
    }

    if (mobile.length !== 10 || isNaN(mobile)) {
        document.getElementById("mobileError").innerHTML = "Enter valid 10-digit mobile number";
        valid = false;
    }

    let genderSelected = false;
    for (let i = 0; i < gender.length; i++) {
        if (gender[i].checked) genderSelected = true;
    }

    if (!genderSelected) {
        document.getElementById("genderError").innerHTML = "Please select gender";
        valid = false;
    }

    if (!terms) {
        document.getElementById("termsError").innerHTML = "Please accept terms & conditions";
        valid = false;
    }

    if (valid) {
        document.getElementById("successMsg").innerHTML =
            "✅ Registration successful!";
    }

    return false; // prevent actual submit
}
</script>

</body>
</html>
